<!doctype html>
<!-- Synthetic page that mounts react-form.js (served as /assets/react-form.js by scripts/test-extension.mjs). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job Application for Help Desk Technician at Acme Example</title>
<style>body { font: 15px/1.4 sans-serif; margin: 24px; } .field { margin: 10px 0; } .field label { display: block; }</style>
</head>
<body>
<div id="app"></div>
<script>
  window.__clicks = [];
  window.__submits = 0;
  document.addEventListener("click", (e) => {
    const b = e.target.closest && e.target.closest("button,input,[role=button],a");
    if (b) window.__clicks.push(b.id || b.textContent.trim());
  }, true);
  document.addEventListener("submit", (e) => {
    e.preventDefault();
    window.__submits++;
  }, true);
</script>
<script src="/assets/react-form.js"></script>
</body>
</html>
